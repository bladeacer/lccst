name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test:swarm

      - name: Run telemetry unit tests
        run: pnpm run test:telemetry

      - name: Run benchmark picker unit tests
        run: pnpm run test:picker

      - name: Run benchmark report unit tests
        run: pnpm run test:report

      # `test:picker-tty` and `test:e2e` must not run in CI. Both start real
      # harnesses, which need `uv`, a network, and a private model endpoint. The
      # picker test also drives `make benchmark-free` through a pseudo terminal,
      # so it writes into `playground/benchmarks`. Run them on a workstation with
      # `make test` and `make test_e2e` instead.

      - name: Run integration tests
        run: pnpm run test:mcp
